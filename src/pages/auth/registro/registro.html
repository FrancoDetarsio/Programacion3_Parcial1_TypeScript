<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store - Register</title>
</head>

<body>
    <header>
        <h1 class="title">Food Store</h1>
    </header>

    <main class="register-layout">
        <h2 class="register-title">Registro</h2>
        <form class="register-form" id="form">
            <div class="register-email">
                <label for="email">Email: </label>
                <input type="email" id="email" name="email" autocomplete="off" placeholder="example@example.com"
                    required>
            </div>
            <div class="register-password">
                <label for="password">Password: </label>
                <input type="password" id="password" name="password" autocomplete="off" placeholder="********" required>
            </div>
            <button class="register-btn" type="submit">Registrarse</button>
        </form>
    </main>

    <footer>Copyright © 2026 | Food Store</footer>
    <script type="module" src="../../../main.ts"></script>
</body>

</html>
