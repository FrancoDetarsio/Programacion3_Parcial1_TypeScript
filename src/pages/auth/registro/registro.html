<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store - Register</title>
</head>

<header>
    <h1 class="title">Food Store</h1>
</header>

<body>
    <h2>Registro</h2>
    <form id="form">

        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="off" placeholder="example@example.com" required>
        </div>
        <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="off" placeholder="********" required>
        </div>

        <button type="submit">Registrarse</button>
    </form>

    <script type="module" src="../../../main.ts"></script>
</body>

</html>
