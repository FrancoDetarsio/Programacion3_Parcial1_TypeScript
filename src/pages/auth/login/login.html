<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store - Login</title>
</head>

<body>
    <header>
        <h1 class="title">Food Store</h1>
    </header>

    <main class="login-layout">
        <h2 class="login-title">Login</h2>
        <form class="login-form" id="form">
            <div class="login-email">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" autocomplete="off" placeholder="example@example.com" required>
            </div>
            <div class="login-password">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" autocomplete="off" placeholder="*************" required>
            </div>
            <button class="login-btn" type="submit">Ingresar</button>
        </form>
        <div class="login-register">
            <p>No tenes una cuenta? <a href="/src/pages/auth/registro/registro.html">Resistarse</a></p>
        </div>
    </main>


    <footer>Copyright © 2026 | Food Store</footer>
    <script type="module" src="../../../main.ts"></script>
</body>

</html>
