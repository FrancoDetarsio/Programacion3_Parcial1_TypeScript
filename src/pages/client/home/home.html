<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store</title>
</head>

<body>
    <header>
        <h1 class="title">Food Store</h1>
        <div class="header-utils">
            <a href="../cart/cart.html" id="cartLink">Carrito</a>
            <button id="logoutButton">Logout</button>
        </div>
    </header>

    <div class="layout">
        <div class="layout-categories">
            <h2 class="categories-title">Categorías</h2>
            <nav class="categories-container" id="categories"></nav>
        </div>

        <main class="layout-main">
            <input type="text" class="buscador" id="buscador" placeholder="Buscar Producto" autocomplete="off">
            <div class="products_grid" id="products_grid"></div>
        </main>
    </div>
    <footer>Todos los derechos reservados</footer>
    <script type="module" src="../../../main.ts"></script>
</body>

</html>
